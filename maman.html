<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pour Maman 💖</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Quicksand:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg1:#fdeef2; --bg2:#efe6fb; --bg3:#e3f1fb;
    --coeur:#e0245e; --coeur-sombre:#b3123f;
    --texte:#6b3a52; --cadre:#fffafc; --bordure:#f4b6cb;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    min-height:100vh; overflow:hidden; position:relative;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-family:'Quicksand',system-ui,sans-serif; color:var(--texte);
    background:linear-gradient(160deg,var(--bg1),var(--bg2) 55%,var(--bg3));
    padding:20px; text-align:center;
  }
  /* nuages doux en fond */
  .nuage{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);filter:blur(30px);z-index:0}
  .n1{width:260px;height:160px;top:6%;left:-60px}
  .n2{width:320px;height:180px;bottom:8%;right:-80px}
  .n3{width:200px;height:120px;top:55%;left:8%}

  .invite{position:relative;z-index:2;font-family:'Caveat',cursive;font-size:1.8rem;margin-bottom:10px;transition:opacity .4s}
  .invite.cache{opacity:0;pointer-events:none;position:absolute}

  /* COEUR */
  .coeur{
    position:relative;z-index:2;width:170px;height:170px;border:0;background:none;cursor:pointer;
    animation:battement 1.1s ease-in-out infinite;
    filter:drop-shadow(0 10px 18px rgba(224,36,94,.45));
    transition:transform .3s;
  }
  .coeur svg{width:100%;height:100%;display:block}
  .coeur:focus-visible{outline:4px solid #fff;outline-offset:6px;border-radius:50%}
  .coeur.parti{animation:none;transform:scale(0);opacity:0;transition:transform .5s,opacity .5s;pointer-events:none;position:absolute}
  @keyframes battement{
    0%,100%{transform:scale(1)}
    15%{transform:scale(1.18)}
    30%{transform:scale(1)}
    45%{transform:scale(1.12)}
    60%{transform:scale(1)}
  }

  /* MESSAGE */
  .cadre{
    position:relative;z-index:2;display:none;max-width:520px;width:100%;
    background:var(--cadre);border:3px solid var(--bordure);border-radius:28px;
    padding:34px 26px 26px;
    box-shadow:0 0 0 8px rgba(255,255,255,.6),0 20px 45px rgba(180,90,130,.25);
  }
  .cadre.visible{display:block;animation:apparition .9s cubic-bezier(.2,1.3,.4,1) both}
  @keyframes apparition{from{opacity:0;transform:scale(.6) translateY(30px)}to{opacity:1;transform:none}}
  .emojis{font-size:1.9rem;letter-spacing:6px;margin-bottom:12px}
  .message{font-family:'Caveat',cursive;font-weight:700;font-size:2.4rem;line-height:1.25;color:var(--coeur-sombre)}
  .signature{font-family:'Caveat',cursive;font-size:1.8rem;margin-top:22px;color:var(--texte)}
  .emojis.bas{margin:14px 0 0;font-size:1.6rem}

  /* BALLONS */
  .ballon{
    position:fixed;bottom:-140px;z-index:1;width:54px;height:68px;border-radius:50% 50% 48% 48%;
    animation:monter linear forwards;pointer-events:none;
  }
  .ballon::after{ /* noeud */
    content:"";position:absolute;bottom:-7px;left:50%;transform:translateX(-50%);
    border:6px solid transparent;border-bottom-color:inherit;border-top:0;
  }
  .ballon::before{ /* ficelle */
    content:"";position:absolute;top:100%;left:50%;width:1px;height:60px;background:rgba(107,58,82,.35);
  }
  @keyframes monter{
    0%{transform:translateY(0) translateX(0) rotate(-4deg)}
    50%{transform:translateY(-60vh) translateX(var(--d)) rotate(4deg)}
    100%{transform:translateY(-130vh) translateX(0) rotate(-4deg)}
  }

  /* petits emojis qui flottent */
  .flotte{position:fixed;bottom:-40px;z-index:1;pointer-events:none;animation:monter linear forwards}

  @media (max-width:480px){
    .message{font-size:2rem}
    .coeur{width:140px;height:140px}
  }
  @media (prefers-reduced-motion:reduce){
    .coeur{animation:none}
    .cadre.visible{animation:none}
  }
</style>
</head>
<body>
  <div class="nuage n1"></div><div class="nuage n2"></div><div class="nuage n3"></div>

  <p class="invite" id="invite">Appuie sur le cœur 💗</p>

  <button class="coeur" id="coeur" aria-label="Appuyer sur le cœur pour lire le message">
    <svg viewBox="0 0 32 29.6" aria-hidden="true">
      <defs>
        <radialGradient id="g" cx="35%" cy="30%" r="75%">
          <stop offset="0" stop-color="#ff5f8f"/>
          <stop offset="1" stop-color="#d4164f"/>
        </radialGradient>
      </defs>
      <path fill="url(#g)" d="M23.6 0c-3.4 0-6.3 2.7-7.6 5.6C14.7 2.7 11.8 0 8.4 0 3.8 0 0 3.8 0 8.4c0 9.4 9.5 11.9 16 21.2 6.1-9.3 16-12.1 16-21.2C32 3.8 28.2 0 23.6 0z"/>
      <ellipse cx="9" cy="7" rx="3.2" ry="2" fill="#fff" opacity=".35" transform="rotate(-30 9 7)"/>
    </svg>
  </button>

  <section class="cadre" id="cadre" aria-live="polite">
    <div class="emojis">🌸 💖 🌷</div>
    <p class="message">Je t'aime maman,<br>tu es la meilleure au monde 🎈</p>
    <div class="emojis bas">🥰 🎈 💐 🎈 🥰</div>
    <p class="signature">Ta fille Fortuné 💕</p>
  </section>

<script>
  const coeur = document.getElementById('coeur');
  const cadre = document.getElementById('cadre');
  const invite = document.getElementById('invite');
  const couleurs = ['#ff8fb1','#ffc2d6','#c9a7f5','#9fd3f7','#ffd6a5','#b8e8c8','#ff6f91'];
  const petits = ['💖','💗','🌸','💕','🎈','🌷','✨'];

  function ballon(){
    const b = document.createElement('div');
    b.className = 'ballon';
    const c = couleurs[Math.floor(Math.random()*couleurs.length)];
    b.style.background = `radial-gradient(circle at 30% 28%, rgba(255,255,255,.7), ${c} 55%)`;
    b.style.borderBottomColor = c;
    b.style.left = Math.random()*92 + 'vw';
    b.style.setProperty('--d', (Math.random()*80-40) + 'px');
    b.style.animationDuration = (7 + Math.random()*6) + 's';
    b.style.transform = `scale(${0.8 + Math.random()*0.6})`;
    document.body.appendChild(b);
    setTimeout(()=>b.remove(), 14000);
  }
  function petit(){
    const e = document.createElement('div');
    e.className = 'flotte';
    e.textContent = petits[Math.floor(Math.random()*petits.length)];
    e.style.left = Math.random()*95 + 'vw';
    e.style.fontSize = (18 + Math.random()*20) + 'px';
    e.style.setProperty('--d', (Math.random()*60-30) + 'px');
    e.style.animationDuration = (6 + Math.random()*5) + 's';
    document.body.appendChild(e);
    setTimeout(()=>e.remove(), 12000);
  }

  coeur.addEventListener('click', () => {
    coeur.classList.add('parti');
    invite.classList.add('cache');
    setTimeout(() => {
      coeur.style.display = 'none';
      cadre.classList.add('visible');
    }, 450);

    // première volée de ballons
    for (let i = 0; i < 14; i++) setTimeout(ballon, i*180);
    for (let i = 0; i < 10; i++) setTimeout(petit, i*250);
    // ballons continus
    setInterval(ballon, 1200);
    setInterval(petit, 1500);
  }, { once: true });
</script>
</body>
</html>
